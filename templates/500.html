
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Server Error - GS MUKONDO Digital Signer</title>

<style>

* {
    box-sizing:border-box;
}

body {
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #102a43,
            #173f5f
        );
}

.card {
    width:100%;
    max-width:600px;

    margin:20px;
    padding:40px;

    background:white;

    border-radius:22px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.25);

    text-align:center;
}

.icon {
    font-size:55px;
    margin-bottom:15px;
}

h1 {
    color:#102a43;
}

p {
    color:#718096;
    line-height:1.6;
}

.error {
    margin-top:20px;

    padding:15px;

    text-align:left;

    background:#fff5f5;

    border:1px solid #fed7d7;

    border-radius:10px;

    color:#9b2c2c;

    font-family:monospace;

    font-size:12px;

    word-break:break-word;
}

.actions {
    margin-top:25px;
}

a {
    display:inline-block;

    padding:12px 20px;

    border-radius:10px;

    background:#173f5f;

    color:white;

    text-decoration:none;

    font-weight:700;
}

</style>

</head>

<body>

<div class="card">

    <div class="icon">
        ⚠️
    </div>

    <h1>
        Internal Server Error
    </h1>

    <p>
        The application encountered an unexpected error.
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <div class="actions">

        {% if session.get("logged_in") %}

            <a href="{{ url_for('dashboard') }}">
                Return to Dashboard
            </a>

        {% else %}

            <a href="{{ url_for('login') }}">
                Return to Login
            </a>

        {% endif %}

    </div>

</div>

</body>

</html>
