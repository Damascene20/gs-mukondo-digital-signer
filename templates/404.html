
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<style>

body {
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#f4f7fb;
    color:#172033;
}

.card {
    max-width:500px;
    margin:20px;
    padding:45px;

    background:white;

    border-radius:20px;

    text-align:center;

    box-shadow:
        0 20px 50px rgba(0,0,0,.08);
}

.code {
    font-size:80px;
    font-weight:900;
    color:#173f5f;
}

p {
    color:#718096;
}

a {
    display:inline-block;
    margin-top:20px;

    padding:12px 18px;

    background:#173f5f;
    color:white;

    border-radius:10px;

    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

    <div class="code">
        404
    </div>

    <h1>Page Not Found</h1>

    <p>
        The page you requested could not be found.
    </p>

    <a href="{{ url_for('home') }}">
        Return Home
    </a>

</div>

</body>
</html>
