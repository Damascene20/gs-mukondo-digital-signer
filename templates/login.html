
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - GS MUKONDO Digital Signer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #102a43,
            #173f5f,
            #0b7285
        );
}

.login-container {
    width: 100%;
    max-width: 440px;
    padding: 20px;
}

.login-card {
    background: rgba(255,255,255,.97);
    border-radius: 24px;
    padding: 38px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.25);
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 18px;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #173f5f;
    color: white;

    font-size: 34px;
    font-weight: 800;
}

h1 {
    text-align: center;
    margin: 0;
    color: #102a43;
}

.subtitle {
    text-align: center;
    color: #718096;
    margin: 8px 0 28px;
    font-size: 14px;
}

.alert {
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 13px;
}

.alert-danger {
    background: #fdecec;
    color: #a61b1b;
}

.alert-warning {
    background: #fff5d8;
    color: #815b00;
}

.alert-success {
    background: #e8f7ef;
    color: #176b4d;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
    color: #344054;
}

input {
    width: 100%;
    padding: 14px;

    border: 1px solid #d9e0e8;
    border-radius: 11px;

    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #173f5f;
    box-shadow:
        0 0 0 3px rgba(23,63,95,.1);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.show-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);

    border: 0;
    background: none;

    cursor: pointer;
    color: #667085;
}

button[type="submit"] {
    width: 100%;
    padding: 14px;

    border: 0;
    border-radius: 11px;

    background: #173f5f;
    color: white;

    font-weight: 750;
    font-size: 14px;

    cursor: pointer;
}

button[type="submit"]:hover {
    background: #102a43;
}

.security {
    margin-top: 22px;
    padding: 13px;

    border-radius: 11px;

    background: #f0f6fa;
    color: #53657a;

    text-align: center;
    font-size: 12px;
}
</style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            ✓
        </div>

        <h1>GS MUKONDO</h1>

        <div class="subtitle">
            Digital Document Signing System
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}

        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        👁
                    </button>

                </div>

            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

        <div class="security">
            🔒 Secure authentication · Google Authenticator 2FA supported
        </div>

    </div>

</div>

<script>
function togglePassword() {

    const input =
        document.getElementById("password");

    input.type =
        input.type === "password"
            ? "text"
            : "password";
}
</script>

</body>
</html>
