
{% extends "base.html" %}

{% block title %}
Create User - {{ application_name }}
{% endblock %}

{% block page_title %}
Create User
{% endblock %}

{% block content %}

<div style="max-width:600px;margin:auto;">

<div class="card">

<h2>👤 Create New User</h2>

<p style="
    color:#718096;
    margin:8px 0 25px;
">
    Create a new account for the digital signing system.
</p>

<form method="POST">

<div class="form-group">

<label>
    Username
</label>

<input
    type="text"
    name="username"
    minlength="3"
    autocomplete="username"
    required
    placeholder="Enter username"
>

</div>

<div class="form-group">

<label>
    Password
</label>

<input
    type="password"
    name="password"
    minlength="8"
    autocomplete="new-password"
    required
    placeholder="Enter password"
>

</div>

<div class="form-group">

<label>
    Role
</label>

<select name="role">

<option value="user">
    User
</option>

<option value="admin">
    Administrator
</option>

</select>

</div>

<div style="
    display:flex;
    gap:10px;
    justify-content:flex-end;
">

<a class="btn btn-light"
   href="{{ url_for('admin_users') }}">
    Cancel
</a>

<button class="btn btn-primary"
        type="submit">
    Create User
</button>

</div>

</form>

</div>

</div>

{% endblock %}
